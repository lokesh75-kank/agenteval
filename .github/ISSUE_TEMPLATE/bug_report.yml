name: Bug report
description: Something doesn't work the way the docs say it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: "`agenteval run --html report.html` exits 0 but writes no file when..."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest config/scenario/code that shows the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agenteval-core version
      placeholder: "0.1.1 (npx agenteval --version)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 20.11, macOS 15 / Ubuntu 24.04"
