[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenteval"
version = "0.1.0"
description = "Reliability and audit-ready testing for LLM agents (Python bridge to the AgentEval engine)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lokesh Kank" }]
requires-python = ">=3.9"
keywords = [
  "llm-eval",
  "agent-evaluation",
  "ai-testing",
  "llm-reliability",
  "rag-evaluation",
  "llm",
  "agents",
  "compliance",
  "audit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/lokesh75-kank/agenteval"
Repository = "https://github.com/lokesh75-kank/agenteval"
Issues = "https://github.com/lokesh75-kank/agenteval/issues"

[project.scripts]
agenteval = "agenteval._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agenteval"]
